# コミット前の検査。Docker を必要とする重い処理はここでは実行せず、
# 生成物の再生成漏れという現実的なミスだけを即座に捕まえる。
# 「再生成した結果が実際に一致するか」の検証は CI が担当する。
pre-commit:
  parallel: true
  commands:
    db-types-staged:
      # 型定義に影響するマイグレーションなら、生成された型も一緒にコミットされているはず。
      # RLSポリシー・GRANT・インデックスだけの変更では型は変わらないため対象外にする。
      glob: "supabase/migrations/*.sql"
      run: |
        if ! git diff --cached --unified=0 -- supabase/migrations |
          grep -Eq '^[+-][[:space:]]*(create[[:space:]]+(or[[:space:]]+replace[[:space:]]+)?(table|view|function|type)|alter[[:space:]]+(table|type|function)|drop[[:space:]]+(table|view|function|type))'; then
          exit 0
        fi

        if ! git diff --cached --name-only | grep -q '^src/types/database.types\.ts$'; then
          echo "エラー: 型定義に影響するマイグレーションを変更したが src/types/database.types.ts が更新されていない。"
          echo "  npm run db:types を実行し、生成結果をステージしてからコミットすること。"
          exit 1
        fi
    lint:
      glob: "*.{ts,tsx,mts}"
      run: npm run lint
